services:
  oracle:
    image: gvenzl/oracle-free:23.9-slim-faststart
    ports:
      - "127.0.0.1:${ORACLE_DEMO_PORT:-11521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set a disposable demo password}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
